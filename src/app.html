    `<div class="conf"><button class="btn pri" data-conf="1">Sure <span class="mono small">(S)</span></button><button class="btn" data-conf="0">Guessing <span class="mono small">(G)</span></button></div>`}

  const inp=$("#typed");if(inp){inp.focus();inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submitTyped(inp.value)}}}

function requeue(){const s=sess,cur=s.queue[s.pos];s.requeued[cur.id]=(s.requeued[cur.id]||0)+1;
  if(QUICK.includes(s.mode)&&s.requeued[cur.id]<=3){const at=Math.min(s.queue.length,s.pos+4);s.queue.splice(at,0,mkEntry(BYID[cur.id]));s.total++}}
function record(ok,conf){const s=sess,cur=s.queue[s.pos],it=BYID[cur.id];s.lastOk=ok;s.lastConf=!!conf;(s.log=s.log||[]).push([ok?1:0,it.d]);
  const retry=(s.requeued[cur.id]||0)>0; // a correct retry in the same session confirms the fact but doesn't climb the ladder
  const rt=(Date.now()-s.qstart)/1000,typed=view4(cur,it).kind==="typed",fast=rt<(typed?10:6),slow=rt>(typed?40:25);
  let q=ok?(conf?(retry?1:2):1):0;if(cur.hinted&&q>1)q=1;if(q===2&&QUICK.includes(s.mode)&&it.t!=="g"){if(fast)q=3;else if(slow)q=1}s.lastSpeed=ok&&!retry?(q===3?"fast":q===1&&slow?"slow":""):"";
  if(!QUICK.includes(s.mode)){const c=S.cal=S.cal||[0,0,0,0];if(conf){c[0]++;if(ok)c[1]++}else{c[2]++;if(ok)c[3]++}if(it.lv===3){const k=it.p+"-hard";S.tm=S.tm||{};const m=S.tm[k]||[0,0];m[0]++;m[1]+=Math.min(600,rt);S.tm[k]=m}}
  grade(it,q);markConf(it,!QUICK.includes(s.mode)&&!ok&&conf);persist();
  s.done++;if(ok)s.correct++;else{s.missed.push(it.id);requeue()}
  if(s.mode==="easy"&&!s.throttled&&s.done>=8&&s.correct/s.done<0.6){const keep=s.queue.filter((e,k)=>k<=s.pos||S.it[e.id]);const rem=s.queue.filter(e=>!e.learn).length-keep.filter(e=>!e.learn).length;s.total-=rem;s.throttled=rem>0;s.queue=keep}
  s.phase="shown";render()}
function submitAnswer(conf){const s=sess,cur=s.queue[s.pos],it=BYID[cur.id],V=view4(cur,it);record(s.sel===V.ans,conf)}
function submitTyped(val){const s=sess,cur=s.queue[s.pos],it=BYID[cur.id],V=view4(cur,it);s.typed=val.trim();
  const nz=x=>x.toLowerCase().replace(/form|schedule|fincen|[^a-z0-9]/g,"");
  const ok=V.ansNum!==undefined?(s.typed!==""&&Math.abs(parseFloat(s.typed.replace(/[^0-9.]/g,""))-V.ansNum)<=(V.tol||1)):V.cmp==="text"?(nz(s.typed)!==""&&nz(s.typed)===nz(V.key)):numEq(s.typed,V.key);
  record(ok,true)}
function advance(){const s=sess;s.pos++;s.phase="ask";s.sel=null;s.typed="";s.qstart=Date.now();if(s.pos>=s.queue.length)return finish();
  if(s.mode!=="mock"&&s.done>0&&s.done%10===0&&s.cpAt!==s.done){s.cpAt=s.done;s.cp=true} // recalculate everything every 10 answers
  render();window.scrollTo(0,0)}
/* in EA Parts 1 to 3 "readiness" means the predicted score on the top card; this older blend of coverage and memory is called "Path covered" there */

function liveLine(){const b=partStats(part);touchDay();return `Learned ${b.fl}/${b.ft} · strength ${pc(b.strength)} · readiness ${pc(b.readyX)} · ${S.day.n} answers today`}
function renderCheckpoint(){const s=sess,a=s.p0,b=partStats(part),last=(s.log||[]).slice(-10),ok=last.filter(x=>x[0]).length,P=PARTS[part];
  const doms=[...new Set(last.map(x=>x[1]))];let next=recList(part)[0];try{if(typeof xpNext==="function"&&!PARTS[part].bk&&PARTS[part].x!=="caa")next=xpNext()}catch(_){}
  const msg=ok>=9?"Strong block. Facts you answered quickly are moving ahead faster.":ok>=6?"Solid. Misses are queued to come back in a few questions.":"Tough block. The session is shifting toward review so these stick before new facts are added.";

  <div class="domains">${doms.map(d=>{const st=domStats(part,d);const [cls,lab]=level(st);return `<div class="dom"><div class="name">${d}. ${esc(P.doms[d][0])}</div><span class="pill ${cls}">${lab}${st.n>=8?" · "+Math.round(st.acc*100)+"%":""}</span><div class="bar"><i style="width:${(st.fpct*100).toFixed(1)}%;background:var(--good)"></i><i class="m" style="width:${Math.max(0,st.spct*100-st.fpct*100).toFixed(1)}%"></i></div><div class="small muted" style="grid-column:1/-1">Learned ${st.fl}/${st.ft} · strength ${pc(st.spct*100)}</div></div>`}).join("")}</div>

function finish(){const s=sess;clearInterval(timerId);
  S.hist.push(Object.assign({t:Date.now(),p:part,m:s.mode,n:s.done||1,c:s.correct},s.mockInfo||{}));S.hist=S.hist.slice(-200);persist();view="results";render();window.scrollTo(0,0)}
function finishMock(){const s=sess;clearInterval(timerId);let c=0;
  const bd={},bl={1:[0,0],2:[0,0],3:[0,0]};let blank=0;s.queue.forEach((cur,k)=>{const it=BYID[cur.id];const a=s.answers[k];if(a==null)blank++;const ok=a===view4(cur,it).ans;if(ok)c++;else s.missed.push(it.id);(bd[it.d]=bd[it.d]||[0,0])[1]++;if(ok)bd[it.d][0]++;bl[itemLv(it)][1]++;if(ok)bl[itemLv(it)][0]++;grade(it,ok?2:0)});

let reviewAll=false;

  const rows=s.queue.map((cur,k)=>{const it=BYID[cur.id],v=view4(cur,it),a=s.answers[k],ok=a===v.ans;return {k,it,v,a,ok}});
  const wrong=rows.filter(r=>!r.ok).length,show=reviewAll?rows:rows.filter(r=>!r.ok);
  const L="ABCD";
  return `<section class="section"><h3>Review: your answers and the correct answers</h3>
   <div class="seg"><button aria-pressed="${!reviewAll}" data-rev="0">Missed (${wrong})</button><button aria-pressed="${reviewAll}" data-rev="1">All ${rows.length} questions</button></div>
   <div class="list">${show.length?show.map(r=>{const ord=r.v.order||r.v.opts.map((_,i)=>i);
     return `<div class="item"><div class="small muted">Question ${r.k+1} · ${esc(PARTS[part].doms[r.it.d][0])} · ${r.ok?'<span style="color:var(--good)">correct</span>':r.a==null?'<span style="color:var(--bad)">not answered</span>':'<span style="color:var(--bad)">wrong</span>'}</div>
      <div class="q">${esc(r.v.stem)}</div>
      ${ord.map((oi,pos)=>{const isC=oi===r.v.ans,isMine=oi===r.a;return `<div style="padding:4px 8px;margin:3px 0;border-radius:6px;border:1px solid ${isC?"var(--good)":isMine?"var(--bad)":"transparent"};background:${isC?"var(--good-soft)":isMine?"var(--bad-soft)":"transparent"}">${L[pos]}. ${esc(r.v.opts[oi])}${isC?" <b>✓ correct answer</b>":""}${isMine&&!isC?" <b>✗ your answer</b>":isMine?" <b>(your answer)</b>":""}</div>`}).join("")}
      ${r.v.ex?`<div class="muted" style="margin-top:6px">${r.it.t==="f"?esc(r.v.ex):stepsHtml(r.v.ex)}</div>`:""}</div>`}).join(""):'<div class="item">No missed questions. Tap "All" to read through every question.</div>'}</div></section>`}
function renderResults(){
  const s=sess;const pct=s.done?Math.round(s.correct/s.done*100):0;const mins=Math.round((Date.now()-s.start)/60000);

  if(b.id==="synctest"){syncTest();return}
  if(b.id==="warnhide"){warnHide=true;render();return}
  if(b.id==="warnbk"){backupDownload();return}
  if(b.id==="bkcopy"){const t=backupText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{S.set.bkT=Date.now();persist();bkNote="Progress code copied. Paste it into this app on your other device, or keep it in a note as a backup.";render()}).catch(()=>{bkNote="Couldn't copy here. Use Download backup file in Settings instead.";render()});return}
  if(b.id==="reset"){confirmReset=true;render();return}
  if(b.id==="resetno"){confirmReset=false;render();return}
  if(b.id==="resetyes"){for(const i of BANK)if(i.p==part)delete S.it[i.id];for(const k in S.dom)if(k.startsWith(part+"-")){delete S.dom[k];if(S.dd)delete S.dd[k]}S.hist=S.hist.filter(h=>h.p!=part);if(PARTS[part].bk&&S.set.les)for(const k in S.set.les)if(k.startsWith("u"+part+"-"))delete S.set.les[k];if(PARTS[part].bk){delete S.set.qbo;delete S.set.tax;delete S.set.labs}confirmReset=false;persist();render();return}
  if(!sess)return;
  if(b.dataset.opt!==undefined){const oi=+b.dataset.opt;if(sess.mode==="mock"){sess.answers[sess.pos]=oi;render()}else if(sess.phase==="ask"){sess.sel=oi;if(QUICK.includes(sess.mode))submitAnswer(true);else render()}return}
  if(b.dataset.conf!==undefined){submitAnswer(b.dataset.conf==="1");return}
  if(b.id==="reveal"){sess.phase="shown";render();return}
  if(b.dataset.rate!==undefined){rateCard(+b.dataset.rate);return}
  if(b.id==="cpgo"){sess.cp=false;sess.qstart=Date.now();render();window.scrollTo(0,0);return}
  if(b.id==="learned"){sess.pos++;sess.qstart=Date.now();render();window.scrollTo(0,0);return}
  if(b.id==="flagitem"){const id=sess.queue[sess.pos].id;S.flag[id]=S.flag[id]?0:1;persist();b.textContent=S.flag[id]?"Flagged for checking":"Flag: looks wrong";return}
  if(b.id==="check"){submitTyped($("#typed").value);return}
  if(typeof calcTeachClick==="function"&&calcTeachClick(b))return;
  if(b.id==="dontknow"){submitTyped("");return}
  if(b.dataset.jump!==undefined){sess.pos=+b.dataset.jump;render();return}
  if(b.id==="prev"){sess.pos=Math.max(0,sess.pos-1);render();return}
  if(b.id==="flag"){sess.flags[sess.pos]=!sess.flags[sess.pos];render();return}
  if(b.id==="next"){if(sess.mode==="mock"){if(sess.pos<sess.queue.length-1){sess.pos++;render()}else finishMock()}else advance();return}
  if(b.id==="quit"){if(sess.mode==="mock")finishMock();else if(sess.done)finish();else{clearInterval(timerId);sess=null;view="home";render()}return}
  if(b.id==="home"){sess=null;view="home";render();window.scrollTo(0,0);return}
  if(b.id==="redo"){newSess("weak",[...new Set(sess.missed)].map(id=>BYID[id]));return}
});

document.addEventListener("change",e=>{if((e.target.id==="bkfile"||e.target.dataset.bk)&&e.target.files&&e.target.files[0]){const r=new FileReader();r.onload=()=>restoreFrom(String(r.result||""));r.readAsText(e.target.files[0])}});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.prior;if(k){S.set.prior=S.set.prior||{};if(e.target.value==="")delete S.set.prior[k];else S.set.prior[k]=Math.max(0,Math.min(100,+e.target.value||0));persist()}});
document.addEventListener("keydown",e=>{
  if(view!=="session"||!sess||e.target.tagName==="INPUT")return;
  if(sess.cp){if(e.key==="Enter"){sess.cp=false;sess.qstart=Date.now();render();window.scrollTo(0,0)}return}
  if(sess.mode==="cards"){if(sess.phase==="ask"&&(e.key===" "||e.key==="Enter")){e.preventDefault();sess.phase="shown";render()}else if(sess.phase==="shown"&&"1234".includes(e.key))rateCard(+e.key-1);return}
  if(sess.queue[sess.pos].learn){if(e.key==="Enter"){sess.pos++;sess.qstart=Date.now();render();window.scrollTo(0,0)}return}
  const it=BYID[sess.queue[sess.pos].id];
  const k="abcd".indexOf(e.key.toLowerCase());const n="1234".indexOf(e.key);const idx=k>=0?k:n;
  const V4=view4(sess.queue[sess.pos],it);if(V4.kind==="typed"){if(sess.phase==="shown"&&e.key==="Enter")advance();return}const ord=V4.order;
  if(sess.mode==="mock"){if(idx>=0&&idx<ord.length){sess.answers[sess.pos]=ord[idx];render()}else if(e.key==="Enter"){$("#next")?.click()}return}
  if(sess.phase==="ask"){if(idx>=0&&idx<ord.length){sess.sel=ord[idx];if(QUICK.includes(sess.mode))submitAnswer(true);else render()}else if(sess.sel!==null&&(e.key.toLowerCase()==="s"||e.key==="Enter"))submitAnswer(true);else if(sess.sel!==null&&e.key.toLowerCase()==="g")submitAnswer(false)}
  else if(e.key==="Enter"){advance()}
});

render();connect();
document.getElementById("sync").addEventListener("click",()=>{if(HOSTED||sess||view!=="home")return;syncTest();window.scrollTo(0,0)});
</script>
